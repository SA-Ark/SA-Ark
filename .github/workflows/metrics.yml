name: metrics
on:
  schedule: [{ cron: "17 3 * * *" }]
  workflow_dispatch:
  push: { branches: [main] }

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: SA-Ark
          template: classic
          base: "header, activity, community, repositories, metadata"
          config_timezone: America/Los_Angeles
          committer_branch: output
          committer_message: "chore(metrics): refresh stats"
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.languages.svg
          user: SA-Ark
          base: ""
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          committer_branch: output
          committer_message: "chore(metrics): refresh languages"
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.isocalendar.svg
          user: SA-Ark
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          committer_branch: output
          committer_message: "chore(metrics): refresh isocalendar"
