<svg xmlns="http://www.w3.org/2000/svg" width="840" height="200" viewBox="0 0 840 200" role="img" aria-labelledby="title desc">
  <title id="title">Estate status dashboard</title>
  <desc id="desc">120+ self-hosted production services, 12,132 contributions in the last 12 months, 180K+ memories indexed at 100% embedding coverage, Lighthouse 100.</desc>
  <style>
    .num{font-family:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-size:32px;font-weight:700;fill:#f0f6fc;letter-spacing:-0.5px}
    .l1{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:10px;font-weight:600;fill:#8b949e;letter-spacing:1px}
    .l2{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;fill:#6e7681;letter-spacing:.3px}
    .hlabel{font-family:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#8b949e;letter-spacing:1.5px}
    .hmeta{font-family:ui-monospace,SFMono-Regular,'SF Mono','JetBrains Mono',Menlo,Consolas,monospace;font-size:11px;fill:#6e7681}
    .cap{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;font-size:11px;fill:#6e7681;letter-spacing:.5px}
  </style>

  <rect x="0" y="0" width="840" height="200" rx="8" fill="#0d1117"/>

  <g opacity="1">
    <animate attributeName="opacity" from="0" to="1" begin="0s" dur="0.5s" fill="freeze"/>
    <circle cx="24" cy="26" r="9" fill="#5A67D8" opacity=".18"/>
    <circle cx="24" cy="26" r="5" fill="#5A67D8">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" begin="0.6s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.4 0 0.6 1;0.4 0 0.6 1"/>
    </circle>
    <text class="hlabel" x="40" y="30">ESTATE · LIVE</text>
    <text class="hmeta" x="824" y="30" text-anchor="end">updated 2026-09-02</text>
  </g>

    <g opacity="1">
      <animate attributeName="opacity" from="0" to="1" begin="0.08s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.08s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
      <rect x="16" y="50" width="193" height="104" rx="10" fill="#5A67D8"/>
      <rect x="16" y="53" width="193" height="101" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="num" x="113" y="102" text-anchor="middle">120+</text>
      <text class="l1" x="113" y="124" text-anchor="middle">PRODUCTION SERVICES</text>
      <text class="l2" x="113" y="140" text-anchor="middle">self-hosted</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0" to="1" begin="0.18s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.18s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
      <rect x="221" y="50" width="193" height="104" rx="10" fill="#5A67D8"/>
      <rect x="221" y="53" width="193" height="101" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="num" x="318" y="102" text-anchor="middle">12,132</text>
      <text class="l1" x="318" y="124" text-anchor="middle">CONTRIBUTIONS</text>
      <text class="l2" x="318" y="140" text-anchor="middle">last 12 months</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0" to="1" begin="0.28s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.28s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
      <rect x="426" y="50" width="193" height="104" rx="10" fill="#5A67D8"/>
      <rect x="426" y="53" width="193" height="101" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="num" x="523" y="102" text-anchor="middle">180K+</text>
      <text class="l1" x="523" y="124" text-anchor="middle">MEMORIES INDEXED</text>
      <text class="l2" x="523" y="140" text-anchor="middle">100% embedded</text>
    </g>
    <g opacity="1">
      <animate attributeName="opacity" from="0" to="1" begin="0.38s" dur="0.5s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 10" to="0 0" begin="0.38s" dur="0.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines="0.2 0.7 0.3 1"/>
      <rect x="631" y="50" width="193" height="104" rx="10" fill="#5A67D8"/>
      <rect x="631" y="53" width="193" height="101" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1"/>
      <text class="num" x="728" y="102" text-anchor="middle">100</text>
      <text class="l1" x="728" y="124" text-anchor="middle">LIGHTHOUSE</text>
      <text class="l2" x="728" y="140" text-anchor="middle">quality gate</text>
    </g>

  <line x1="16" y1="172" x2="824" y2="172" stroke="#21262d" stroke-width="1"/>
  <text class="cap" x="420" y="188" text-anchor="middle">self-hosted · Rust · verified numbers</text>
</svg>
